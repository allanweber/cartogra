# K8s Discovery Test Manifests
#
# Deploys all 8 Trading-Journal test services into a `prod` namespace
# labeled for Cartogra K8s auto-discovery.
#
# Services match seed/create-test-repos.sh exactly (names, ports, teams).
# Images use nginxinc/nginx-unprivileged:1.25 as a stand-in:
#   - runs as non-root (compatible with runAsNonRoot: true)
#   - listens on port 8080 inside the container
# Service.port preserves the logical port from each service definition.
# Service.targetPort points to 8080 where nginx actually listens.
#
# Usage:
#   kubectl apply -f seed/k8s-discovery-manifests.yaml
#
# To use real images after running create-test-repos.sh and building:
#   Replace image + containerPort + targetPort per service with the real values.

---
# ── Namespace ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    app.kubernetes.io/managed-by: cartogra-seed
    cartogra.io/tenant-id: "3986e535-2760-43e7-b173-aea898a6b7b0"

---
# ── trade-service  (Java / Spring Boot, team: trading-core, logical port: 8090)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: prod
  labels:
    app: trade-service
    team: trading-core
    version: "1.0.0"
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade-service
  template:
    metadata:
      labels:
        app: trade-service
        team: trading-core
        version: "1.0.0"
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: trade-service
          image: nginxinc/nginx-unprivileged:1.25
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trade-service
  namespace: prod
  labels:
    app: trade-service
    team: trading-core
spec:
  type: ClusterIP
  selector:
    app: trade-service
  ports:
    - port: 8090
      targetPort: 8080
      protocol: TCP

