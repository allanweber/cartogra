spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cartogra?currentSchema=registry}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # All ingestion traffic under a single namespace.
            - id: ingestion
              uri: ${INGESTION_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/ingestion/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: ingestion
                    fallbackPath: /internal/fallback/ingestion
                    statusCodes: 500,501,502,503,504
            - id: registry
              uri: ${REGISTRY_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/registry/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: registry
                    fallbackPath: /internal/fallback/registry
                    statusCodes: 500,501,502,503,504

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          transport: http
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      registry:
        base-config: default
      ingestion:
        base-config: default

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3006}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3006}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY_SECONDS:900}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:2592000}
    cookie-secure: true
  resend:
    api-key: ${RESEND_API_KEY}
    from-address: ${RESEND_FROM:noreply@cartogra.dev}
    test-mode: ${RESEND_TEST_MODE:false}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/auth/oauth/google/callback
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://openidconnect.googleapis.com/v1/userinfo
    github:
      client-id: ${GITHUB_CLIENT_ID}
      client-secret: ${GITHUB_CLIENT_SECRET}
      redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/auth/oauth/github/callback
      token-uri: https://github.com/login/oauth/access_token
      userinfo-uri: https://api.github.com/user
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-replenish-rate: ${RATE_LIMIT_DEFAULT_REPLENISH:20}
    default-burst-capacity: ${RATE_LIMIT_DEFAULT_BURST:40}
    auth-replenish-rate: ${RATE_LIMIT_AUTH_REPLENISH:5}
    auth-burst-capacity: ${RATE_LIMIT_AUTH_BURST:10}
