spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: registry
              uri: http://${REGISTRY_HOST:localhost}:${REGISTRY_PORT:8081}
              predicates:
                - Path=/api/v1/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
      export:
        otlp:
          enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
    opentelemetry:
      tracing:
        export:
          otlp:
            endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
            transport: http

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","service":"gateway","traceId":"%X{traceId:-none}","msg":"%msg"}%n'
