spring:
  application:
    name: ingestion
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cartogra?currentSchema=ingestion}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ingestion-sync-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  flyway:
    enabled: true
    create-schemas: true
    schemas: ingestion
    default-schema: ingestion
    locations: classpath:db/migration
    table: flyway_schema_history

ingestion:
  sync:
    stale-timeout: PT30M
    reaper-interval: PT1M
    poll-interval: ${INGESTION_SYNC_POLL_INTERVAL:PT15M}
  k8s:
    credentials-key: ${CLUSTER_CREDENTIALS_KEY:}
  registry:
    base-url: ${REGISTRY_URI:http://localhost:8081}/api/v1/registry

server:
  port: 8085
  shutdown: graceful
  servlet:
    context-path: /api/v1/ingestion

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          transport: http
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
