spring:
  application:
    name: ingestion
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:cartogra}
    username: ${DB_USER:cartogra}
    password: ${DB_PASSWORD:cartogra}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_ingestion

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","service":"ingestion","traceId":"%X{traceId:-none}","msg":"%msg"}%n'
