spring:
  application:
    name: ingestion
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5436/cartogra?currentSchema=ingestion
    username: cartogra
    password: cartogra
  flyway:
    enabled: true
    create-schemas: true
    schemas: ingestion
    default-schema: ingestion
    locations: classpath:db/migration
    table: flyway_schema_history

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","service":"ingestion","traceId":"%X{traceId:-none}","msg":"%msg"}%n'
