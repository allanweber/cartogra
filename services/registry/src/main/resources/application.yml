spring:
  application:
    name: registry
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5436/cartogra
    username: cartogra
    password: cartogra
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_registry

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
    logging:
      export:
        endpoint: http://localhost:4318/v1/logs

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","service":"registry","traceId":"%X{traceId:-none}","msg":"%msg"}%n'
