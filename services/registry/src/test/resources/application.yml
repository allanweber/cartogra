spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

management:
  tracing:
    sampling:
      probability: 0.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
    logging:
      export:
        otlp:
          enabled: false
