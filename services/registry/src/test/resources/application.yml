server:
  servlet:
    context-path: /api/v1/registry

spring:
  flyway:
    url: ${spring.datasource.url}
    init-sqls: SET app.rls_bypass = 'on'
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual_immediate
  datasource:
    type: io.cartogra.web.tenant.TenantAwareDataSource
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

management:
  tracing:
    sampling:
      probability: 0.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
    logging:
      export:
        otlp:
          enabled: false

app:
  internal-token:
    key: test-internal-token-key-7f3a9c1e5b2d8f40
