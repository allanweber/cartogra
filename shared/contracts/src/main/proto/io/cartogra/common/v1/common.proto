syntax = "proto3";

package io.cartogra.common.v1;

option java_package = "io.cartogra.grpc.common.v1";
option java_multiple_files = true;
option java_outer_classname = "CommonProto";

// Tenant context passed on every internal gRPC call.
message TenantContext {
  string tenant_id = 1;
}

// Pagination request parameters.
message PageRequest {
  int32 page = 1;
  int32 size = 2;
}

// Pagination metadata returned with paged responses.
message PageInfo {
  int32 total_elements = 1;
  int32 total_pages    = 2;
  int32 page           = 3;
  int32 size           = 4;
}
