name: Bug report
description: Something in Cartogra is broken or behaves unexpectedly.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include the `traceId` from the error message if you have one — it lets us find the request in the logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message and traceId.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run the quick start
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Gateway / auth
        - Registry
        - Topology
        - Ingestion (GitHub / Azure DevOps / Kubernetes)
        - Local setup / Docker Compose
        - Helm / deployment
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA you ran.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker version — whatever seems relevant.
