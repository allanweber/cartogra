name: CI Full Build

on:
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend — Build & Test (all services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build & test registry
        run: gradle :services:registry:build --no-daemon

      - name: Upload registry test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-registry
          path: |
            services/registry/build/reports/tests/
            services/registry/build/test-results/
          retention-days: 14

      - name: Upload registry coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-registry
          path: services/registry/build/reports/jacoco/test/html/
          retention-days: 14

      - name: Build & test gateway
        run: gradle :services:gateway:build --no-daemon

      - name: Upload gateway test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-gateway
          path: |
            services/gateway/build/reports/tests/
            services/gateway/build/test-results/
          retention-days: 14

      # - name: Build & test topology
      #   run: gradle :services:topology:build --no-daemon

      # - name: Build & test contract
      #   run: gradle :services:contract:build --no-daemon

      # - name: Build & test intelligence
      #   run: gradle :services:intelligence:build --no-daemon

      - name: Build & test ingestion
        run: gradle :services:ingestion:build --no-daemon

      - name: Upload ingestion test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-ingestion
          path: |
            services/ingestion/build/reports/tests/
            services/ingestion/build/test-results/
          retention-days: 14

      - name: Upload ingestion coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ingestion
          path: services/ingestion/build/reports/jacoco/test/html/
          retention-days: 14

      - name: Trivy vulnerability scan — fail on CRITICAL or HIGH (unfixed suppressed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-report.txt'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## Backend — Build & Test (all services)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full unconditional build — every service built and tested regardless of changes." >> $GITHUB_STEP_SUMMARY

          if [ -f trivy-report.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Trivy Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend — Lint & Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lint, type-check, and tests ran (unconditional full build)" >> $GITHUB_STEP_SUMMARY

  container-build:
    name: Container — Build checks (all images)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Build registry image
        run: docker build -f infra/docker/registry/Dockerfile -t cartogra/registry:ci .

      - name: Build gateway image
        run: docker build -f infra/docker/gateway/Dockerfile -t cartogra/gateway:ci .

      - name: Build ingestion image
        run: docker build -f infra/docker/ingestion/Dockerfile -t cartogra/ingestion:ci .

      - name: Build frontend image
        run: docker build -f infra/docker/frontend/Dockerfile -t cartogra/frontend:ci .

      - name: Write job summary
        if: always()
        run: |
          echo "## Container — Build Checks (all images)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| registry | \`cartogra/registry:ci\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| gateway | \`cartogra/gateway:ci\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| ingestion | \`cartogra/ingestion:ci\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | \`cartogra/frontend:ci\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
