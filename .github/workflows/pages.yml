name: Pages

# Publishes the landing page in portfolio/ as the site root, so it serves from
# https://<user>.github.io/<repo>/ rather than a /portfolio/ subpath. Branch-based
# Pages cannot use an arbitrary folder as its source — only / or /docs — which is
# why this goes through Actions.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload portfolio as the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: portfolio

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
