name: Deploy

# Installs one commit's images (built by images.yml) on the production k3s host, cartogra.dev (ADR-0030).
# Automatic after images.yml succeeds for a push to main; manual dispatch with `sha` for rollbacks.
# Needs the `production` environment: secret KUBECONFIG (the deployer ServiceAccount from infra/k8s/cluster-setup.yaml, which creates the namespaces), variables ACME_GITHUB_ORG and ALERT_EMAIL.

on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA whose images to deploy (default: this run's commit)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: helm upgrade
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment: production
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SHA }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Images exist for this commit
        run: |
          for image in gateway registry topology ingestion frontend acme; do
            docker manifest inspect "ghcr.io/${{ github.repository_owner }}/cartogra-$image:$SHA" > /dev/null \
              || { echo "missing cartogra-$image:$SHA (did images.yml finish?)"; exit 1; }
          done

      - name: Cartogra
        run: |
          helm upgrade --install cartogra infra/helm/cartogra -n cartogra \
            -f infra/helm/cartogra/values-demo.yaml \
            --set global.imageTag="$SHA" \
            --set alerting.email.to="${{ vars.ALERT_EMAIL }}" \
            --wait --timeout 15m

      - name: Acme (runs the bootstrap Job)
        run: |
          helm upgrade --install acme infra/helm/acme -n acme-system \
            --set image.tag="$SHA" \
            --set bootstrap.githubOrg="${{ vars.ACME_GITHUB_ORG }}" \
            --wait --timeout 20m
