# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
grpc                  = "1.80.0"
protobuf              = "4.33.0"
protobuf-gradle       = "0.10.0"
spring-grpc           = "1.0.1"
javax-annotation-api  = "1.3.2"

[libraries]
grpc-stub             = { group = "io.grpc",                       name = "grpc-stub",                                    version.ref = "grpc" }
grpc-protobuf         = { group = "io.grpc",                       name = "grpc-protobuf",                                version.ref = "grpc" }
grpc-netty-shaded     = { group = "io.grpc",                       name = "grpc-netty-shaded",                            version.ref = "grpc" }
protobuf-java         = { group = "com.google.protobuf",           name = "protobuf-java",                                version.ref = "protobuf" }
spring-grpc-starter   = { group = "org.springframework.grpc",      name = "spring-grpc-spring-boot-starter",              version.ref = "spring-grpc" }
javax-annotation-api  = { group = "javax.annotation",              name = "javax.annotation-api",                         version.ref = "javax-annotation-api" }

[plugins]
protobuf              = { id = "com.google.protobuf",              version.ref = "protobuf-gradle" }
