openapi: "3.1.0"
info:
  title: Cartogra Topology API
  version: "0.2.0"
  description: |
    Declare, edit, and remove dependency edges between services; read the tenant-wide
    dependency graph; read a single service's upstream and downstream dependencies.

    **Authentication:** JWT cookie or Bearer token (Gateway-issued). Gateway injects `X-Tenant-Id`.

    **Response envelope**:
    - Success: `{ "data": <T>, "traceId": "<32-hex>" }`
    - Error: `{ "error": { "code", "message", "details" }, "traceId": "<32-hex>" }`
    - Header: `X-Trace-Id: <same 32-hex traceId>`

servers:
  - url: http://localhost:8082
    description: Local development (direct)
  - url: http://localhost:8080/api/topology
    description: Local development (via Gateway)

tags:
  - name: dependencies
    description: Declare, edit, remove, and read service dependency edges
  - name: graph
    description: Tenant-wide dependency graph read
  - name: health
    description: Liveness and readiness probes

paths:
  # ── Dependencies ──────────────────────────────────────────────────────────

  /dependencies:
    post:
      summary: Declare a dependency edge between two services
      description: |
        Always creates a `DECLARED` edge — dependency type is never client-settable. Requires
        ADMIN or membership on either side of the edge.
      operationId: createDependency
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareDependencyRequest"
      responses:
        "201":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SelfDependency"

  /dependencies/{dependencyId}:
    put:
      summary: Edit a declared dependency's endpoints, protocol, or metadata
      operationId: updateDependency
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DependencyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareDependencyRequest"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SelfDependency"

    delete:
      summary: Remove a declared dependency edge (soft delete)
      operationId: deleteDependency
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DependencyIdParam"
      responses:
        "204":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /services/{serviceId}/dependencies:
    get:
      summary: Read a service's declared dependencies, bucketed by direction
      description: |
        `downstream` — edges where the requested service is the source (what it depends on).
        `upstream` — edges where the requested service is the target (what depends on it).
        Each entry is denormalized with the counterpart service's name, team, tier, and health
        status. Observed dependencies are excluded — no data exists until Phase 3's OTel span
        worker ships.
      operationId: getServiceDependencies
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDependenciesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Graph ─────────────────────────────────────────────────────────────────

  /graph:
    get:
      summary: Read the tenant-wide dependency graph
      description: |
        Returns every live service as a node, plus the dependency edges between them (capped
        at 500 nodes; `truncated: true` when the cap was hit). Optionally scoped to a team —
        cross-team neighbors of an in-team node are still included, sharing the remaining node
        budget. No edge in the response ever references a node absent from it.
      operationId: getGraph
      tags: [graph]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/DependencyType"
        - name: limit
          in: query
          description: Max nodes to return (must be ≥ 1; capped at 500 server-side)
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Health ────────────────────────────────────────────────────────────────

  /actuator/health/live:
    get:
      summary: Liveness probe
      operationId: liveness
      tags: [health]
      responses:
        "200":
          description: Service alive

  /actuator/health/ready:
    get:
      summary: Readiness probe
      operationId: readiness
      tags: [health]
      responses:
        "200":
          description: Service ready
        "503":
          description: Service not ready

# ── Components ─────────────────────────────────────────────────────────────

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cartogra_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XTraceId:
      description: OTel trace ID — 32 lowercase hex characters, no dashes
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  parameters:
    DependencyIdParam:
      name: dependencyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ApiResponse:
      type: object
      required: [data, traceId]
      properties:
        data: {}
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    ApiError:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    DependencyType:
      type: string
      enum: [DECLARED, OBSERVED]

    DependencyProtocol:
      type: string
      enum: [HTTP, GRPC, KAFKA, DB]

    # ── Dependency ────────────────────────────────────────────────────────────

    DeclareDependencyRequest:
      type: object
      required: [sourceServiceId, targetServiceId, protocol]
      properties:
        sourceServiceId:
          type: string
          format: uuid
        targetServiceId:
          type: string
          format: uuid
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true

    DependencyDto:
      type: object
      required: [id, sourceServiceId, targetServiceId, type, protocol, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceServiceId:
          type: string
          format: uuid
        targetServiceId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DependencyType"
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DependencyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DependencyDto"

    DependencyDirectionEntry:
      description: A dependency edge hydrated with its counterpart service's graph projection.
      type: object
      required: [id, serviceId, name, healthStatus, protocol, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          description: The counterpart service's ID
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        tier:
          type: string
          enum: [CRITICAL, STANDARD, EXPERIMENTAL]
          nullable: true
        healthStatus:
          type: string
          enum: [HEALTHY, DEGRADED, UNHEALTHY, PROBE_AUTH_FAILED, UNKNOWN]
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceDependenciesResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [upstream, downstream]
              properties:
                upstream:
                  type: array
                  items:
                    $ref: "#/components/schemas/DependencyDirectionEntry"
                downstream:
                  type: array
                  items:
                    $ref: "#/components/schemas/DependencyDirectionEntry"

    # ── Graph ─────────────────────────────────────────────────────────────────

    GraphNodeDto:
      type: object
      required: [serviceId, name, healthStatus]
      properties:
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        tier:
          type: string
          enum: [CRITICAL, STANDARD, EXPERIMENTAL]
          nullable: true
        healthStatus:
          type: string
          enum: [HEALTHY, DEGRADED, UNHEALTHY, PROBE_AUTH_FAILED, UNKNOWN]

    GraphEdgeDto:
      type: object
      required: [source, target, dependencyType, protocol]
      properties:
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        dependencyType:
          $ref: "#/components/schemas/DependencyType"
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true

    GraphResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [nodes, edges, truncated]
              properties:
                nodes:
                  type: array
                  items:
                    $ref: "#/components/schemas/GraphNodeDto"
                edges:
                  type: array
                  items:
                    $ref: "#/components/schemas/GraphEdgeDto"
                truncated:
                  type: boolean

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: Not an admin or a member of either service's owning team
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: An equivalent declared dependency already exists
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    SelfDependency:
      description: Source and target are the same service
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
