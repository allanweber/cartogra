openapi: "3.1.0"
info:
  title: Cartogra Topology API
  version: "0.2.0"
  description: |
    Declare, edit, and remove dependency edges between services; read the tenant-wide
    dependency graph; read a single service's upstream and downstream dependencies.

    **Authentication:** JWT cookie or Bearer token (Gateway-issued). Gateway injects `X-Tenant-Id`.

    **Response envelope**:
    - Success: `{ "data": <T>, "traceId": "<32-hex>" }`
    - Error: `{ "error": { "code", "message", "details" }, "traceId": "<32-hex>" }`
    - Header: `X-Trace-Id: <same 32-hex traceId>`

servers:
  - url: http://localhost:8082
    description: Local development (direct)
  - url: http://localhost:8080/api/topology
    description: Local development (via Gateway)

tags:
  - name: dependencies
    description: Declare, edit, remove, and read service dependency edges
  - name: graph
    description: Tenant-wide dependency graph read
  - name: blast-radius
    description: Bounded upstream/downstream impact traversal from one service
  - name: cycles
    description: Elementary cycle detection
  - name: spofs
    description: Single point of failure detection
  - name: risks
    description: Aggregated risk findings across cycles, SPOFs, orphans, and drift
  - name: health
    description: Liveness and readiness probes

paths:
  # ── Dependencies ──────────────────────────────────────────────────────────

  /dependencies:
    post:
      summary: Declare a dependency edge between two services
      description: |
        Always creates a `DECLARED` edge — dependency type is never client-settable. Requires
        ADMIN or membership on either side of the edge.
      operationId: createDependency
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareDependencyRequest"
      responses:
        "201":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SelfDependency"

  /dependencies/{dependencyId}:
    put:
      summary: Edit a declared dependency's endpoints, protocol, or metadata
      operationId: updateDependency
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DependencyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareDependencyRequest"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SelfDependency"

    delete:
      summary: Remove a declared dependency edge (soft delete)
      operationId: deleteDependency
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DependencyIdParam"
      responses:
        "204":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /services/{serviceId}/dependencies:
    get:
      summary: Read a service's declared dependencies, bucketed by direction
      description: |
        `downstream` — edges where the requested service is the source (what it depends on).
        `upstream` — edges where the requested service is the target (what depends on it).
        Each entry is denormalized with the counterpart service's name, team, tier, and health
        status. Observed dependencies are excluded — no data exists until Phase 3's OTel span
        worker ships.
      operationId: getServiceDependencies
      tags: [dependencies]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDependenciesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Graph ─────────────────────────────────────────────────────────────────

  /graph:
    get:
      summary: Read the tenant-wide dependency graph
      description: |
        Returns every live service as a node, plus the dependency edges between them (capped
        at 500 nodes; `truncated: true` when the cap was hit). Optionally scoped to a team —
        cross-team neighbors of an in-team node are still included, sharing the remaining node
        budget. No edge in the response ever references a node absent from it.
      operationId: getGraph
      tags: [graph]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/DependencyType"
        - name: limit
          in: query
          description: Max nodes to return (must be ≥ 1; capped at 500 server-side)
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /blast-radius/{serviceId}:
    get:
      summary: Services affected by, or depended on by, a service
      description: |
        Bounded traversal of the dependency graph from `serviceId`. **Direction naming is the
        opposite of `/services/{serviceId}/dependencies`:** `upstream` here is "what this service
        depends on"; `downstream` is "who is impacted if this service fails". Each service is
        reported once at its shortest distance. `depth` defaults to 3 and is clamped to 6.
        Results are capped at 200 live services per direction. `depthTruncated` /
        `nodesBeyondDepth` report services one hop past the depth cap; `nodeCapTruncated` /
        `nodesBeyondCap` report services dropped by the 200 cap. Soft-deleted services are
        excluded before the cap is applied.
      operationId: getBlastRadius
      tags: [blast-radius]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          description: Restrict to one direction; the other comes back empty. Omit for both.
          schema:
            type: string
            enum: [UPSTREAM, DOWNSTREAM]
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 3
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The traversal exceeded its time budget

  /cycles:
    get:
      summary: Find elementary cycles in the tenant's dependency graph
      description: |
        Returns every elementary cycle (a closed directed walk that revisits no interior node)
        up to 8 members, normalized to a rotation-invariant key so the same cycle is never
        listed twice regardless of which member it's discovered from. Capped at 200 distinct
        cycles server-side; `truncated: true` when the cap was hit.
      operationId: getCycles
      tags: [cycles]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/DependencyType"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CyclesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /spofs:
    get:
      summary: Find single points of failure in the tenant's dependency graph
      description: |
        A service is flagged when its fan-in (distinct services depending on it, declared and
        observed combined) is at or above a tenant-configurable threshold (default 5). Severity
        escalates to `critical` when the service is `CRITICAL`-tier or has no owning team
        (orphan); `warning` otherwise. `threshold` and `rationale` travel in every response, not
        just in docs.
      operationId: getSpofs
      tags: [spofs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpofsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /risks:
    get:
      summary: Aggregated risk findings across the tenant's dependency graph
      description: |
        Combines cycle, SPOF, orphan, and drift findings into one severity-sorted, paginated
        list. Ordering is deterministic (severity, type, title, id). Each finding carries a deterministic `id` (stable across calls for the same
        underlying state) so clients can track dismissal locally.
      operationId: getRisks
      tags: [risks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RisksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Health ────────────────────────────────────────────────────────────────

  /actuator/health/live:
    get:
      summary: Liveness probe
      operationId: liveness
      tags: [health]
      responses:
        "200":
          description: Service alive

  /actuator/health/ready:
    get:
      summary: Readiness probe
      operationId: readiness
      tags: [health]
      responses:
        "200":
          description: Service ready
        "503":
          description: Service not ready

# ── Components ─────────────────────────────────────────────────────────────

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cartogra_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XTraceId:
      description: OTel trace ID — 32 lowercase hex characters, no dashes
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  parameters:
    DependencyIdParam:
      name: dependencyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ApiResponse:
      type: object
      required: [data, traceId]
      properties:
        data: {}
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    ApiError:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    DependencyType:
      type: string
      enum: [DECLARED, OBSERVED]

    DependencyProtocol:
      type: string
      enum: [HTTP, GRPC, KAFKA, DB]

    # ── Dependency ────────────────────────────────────────────────────────────

    DeclareDependencyRequest:
      type: object
      required: [sourceServiceId, targetServiceId, protocol]
      properties:
        sourceServiceId:
          type: string
          format: uuid
        targetServiceId:
          type: string
          format: uuid
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true

    DependencyDto:
      type: object
      required: [id, sourceServiceId, targetServiceId, type, protocol, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceServiceId:
          type: string
          format: uuid
        targetServiceId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DependencyType"
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DependencyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DependencyDto"

    DependencyDirectionEntry:
      description: A dependency edge hydrated with its counterpart service's graph projection.
      type: object
      required: [id, serviceId, name, healthStatus, protocol, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          description: The counterpart service's ID
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        tier:
          type: string
          enum: [CRITICAL, STANDARD, EXPERIMENTAL]
          nullable: true
        healthStatus:
          type: string
          enum: [HEALTHY, DEGRADED, UNHEALTHY, PROBE_AUTH_FAILED, UNKNOWN]
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceDependenciesResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [upstream, downstream]
              properties:
                upstream:
                  type: array
                  items:
                    $ref: "#/components/schemas/DependencyDirectionEntry"
                downstream:
                  type: array
                  items:
                    $ref: "#/components/schemas/DependencyDirectionEntry"

    # ── Graph ─────────────────────────────────────────────────────────────────

    GraphNodeDto:
      type: object
      required: [serviceId, name, healthStatus]
      properties:
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        tier:
          type: string
          enum: [CRITICAL, STANDARD, EXPERIMENTAL]
          nullable: true
        healthStatus:
          type: string
          enum: [HEALTHY, DEGRADED, UNHEALTHY, PROBE_AUTH_FAILED, UNKNOWN]

    GraphEdgeDto:
      type: object
      required: [source, target, dependencyType, protocol]
      properties:
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        dependencyType:
          $ref: "#/components/schemas/DependencyType"
        protocol:
          $ref: "#/components/schemas/DependencyProtocol"
        metadata:
          type: string
          nullable: true

    GraphResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [nodes, edges, truncated]
              properties:
                nodes:
                  type: array
                  items:
                    $ref: "#/components/schemas/GraphNodeDto"
                edges:
                  type: array
                  items:
                    $ref: "#/components/schemas/GraphEdgeDto"
                truncated:
                  type: boolean

    # ── Cycles ────────────────────────────────────────────────────────────────

    BlastRadiusEntryDto:
      type: object
      required: [serviceId, name, healthStatus, distance]
      properties:
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        tier:
          type: string
          enum: [CRITICAL, STANDARD, EXPERIMENTAL]
          nullable: true
        healthStatus:
          type: string
        distance:
          type: integer
          minimum: 1

    BlastRadiusDirectionDto:
      type: object
      required: [entries, depthTruncated, nodesBeyondDepth, nodeCapTruncated, nodesBeyondCap]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BlastRadiusEntryDto"
        depthTruncated:
          type: boolean
        nodesBeyondDepth:
          type: integer
        nodeCapTruncated:
          type: boolean
        nodesBeyondCap:
          type: integer

    BlastRadiusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [serviceId, upstream, downstream, maxDepth]
              properties:
                serviceId:
                  type: string
                  format: uuid
                upstream:
                  $ref: "#/components/schemas/BlastRadiusDirectionDto"
                downstream:
                  $ref: "#/components/schemas/BlastRadiusDirectionDto"
                maxDepth:
                  type: integer

    CycleDto:
      type: object
      required: [members, length]
      properties:
        members:
          description: Service IDs in cycle order, rotated to start at the smallest UUID
          type: array
          items:
            type: string
            format: uuid
        length:
          type: integer

    CyclesResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [cycles, truncated]
              properties:
                cycles:
                  type: array
                  items:
                    $ref: "#/components/schemas/CycleDto"
                truncated:
                  type: boolean

    # ── SPOFs ─────────────────────────────────────────────────────────────────

    SpofDto:
      type: object
      required: [serviceId, name, healthStatus, fanIn, severity]
      properties:
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
          nullable: true
        tier:
          type: string
          enum: [CRITICAL, STANDARD, EXPERIMENTAL]
          nullable: true
        healthStatus:
          type: string
          enum: [HEALTHY, DEGRADED, UNHEALTHY, PROBE_AUTH_FAILED, UNKNOWN]
        fanIn:
          type: integer
        severity:
          $ref: "#/components/schemas/RiskSeverity"

    SpofsResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [threshold, rationale, items, truncated]
              properties:
                threshold:
                  type: integer
                rationale:
                  type: string
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/SpofDto"
                truncated:
                  type: boolean
                  description: True when more than 200 services met the threshold; the list is the top 200 by fan-in.

    # ── Risks ─────────────────────────────────────────────────────────────────

    RiskSeverity:
      type: string
      enum: [critical, warning, info]

    RiskType:
      type: string
      enum: [spof, cycle, orphan, drift]

    RiskDto:
      type: object
      required: [id, type, severity, title, explanation, fix, affectedServices]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/RiskType"
        severity:
          $ref: "#/components/schemas/RiskSeverity"
        title:
          type: string
        explanation:
          type: string
        fix:
          type: string
        affectedServices:
          type: array
          items:
            type: string
            format: uuid

    RisksResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [items, total, limit, offset, truncated]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/RiskDto"
                total:
                  type: integer
                  format: int64
                  description: Count across the capped sources; the true total is higher when `truncated` is true.
                limit:
                  type: integer
                offset:
                  type: integer
                truncated:
                  type: boolean
                  description: True when any risk source (cycles, SPOFs, orphans, drift) hit its cap of 200.

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: Not an admin or a member of either service's owning team
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: An equivalent declared dependency already exists
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    SelfDependency:
      description: Source and target are the same service
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
