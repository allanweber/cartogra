openapi: "3.1.0"
info:
  title: Cartogra Registry API
  version: "0.1.0"
  description: |
    Service CRUD, team ownership, SCM connections, and CI contract checks.

    **Authentication:** All endpoints require a valid JWT (cookie or Bearer token issued by the Gateway).
    The Gateway injects `X-Tenant-Id` — clients must not set this header.

    **CI endpoints** (`/ci/*`) accept `X-Cartogra-Api-Key` instead of JWT.

    **Response envelope**:
    - Success: `{ "data": <T>, "traceId": "<32-hex>" }`
    - Error: `{ "error": { "code", "message", "details" }, "traceId": "<32-hex>" }`
    - Header: `X-Trace-Id: <same 32-hex traceId>`

    **Pagination:** List endpoints use `limit` (default 20, max 100) and `offset` (default 0).
    Paginated `data` shape: `{ "items": [...], "total": N, "limit": 20, "offset": 0 }`.

servers:
  - url: http://localhost:8081/api/v1
    description: Local development (direct)
  - url: http://localhost:8080/api/registry/api/v1
    description: Local development (via Gateway)

tags:
  - name: services
    description: Service catalog CRUD
  - name: teams
    description: Team management
  - name: scm-connections
    description: SCM provider connections (GitHub App, Azure DevOps)
  - name: ci
    description: CI/CD integration endpoints — API key auth only
  - name: health
    description: Liveness and readiness probes

paths:
  # ── Services ───────────────────────────────────────────────────────────────

  /services:
    get:
      summary: List services for the authenticated tenant
      operationId: listServices
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: health
          in: query
          schema:
            type: string
            enum: [healthy, degraded, unknown]
        - name: techStack
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Full-text search on name and description
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of services
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      summary: Register a new service
      operationId: createService
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service registered
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /services/orphaned:
    get:
      summary: List services with no team assignment
      operationId: listOrphanedServices
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Paginated list of orphaned services
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /services/{serviceId}:
    get:
      summary: Get service by ID
      operationId: getService
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
      responses:
        "200":
          description: Service found
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    put:
      summary: Update service metadata
      operationId: updateService
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Service updated
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      summary: Soft-delete a service
      operationId: deleteService
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
      responses:
        "204":
          description: Service soft-deleted
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /services/{serviceId}/owner:
    patch:
      summary: Assign team ownership to a service
      operationId: assignServiceOwner
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignOwnerRequest"
      responses:
        "200":
          description: Ownership assigned
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /services/{serviceId}/history:
    get:
      summary: Service change history (append-only audit log)
      operationId: getServiceHistory
      tags: [services]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceIdParam"
        - name: at
          in: query
          description: Point-in-time snapshot (ISO-8601). If supplied, returns the single snapshot closest to this timestamp.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Paginated history entries
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHistoryPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Teams ──────────────────────────────────────────────────────────────────

  /teams:
    get:
      summary: List teams for the authenticated tenant
      operationId: listTeams
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Paginated list of teams
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      summary: Create a new team
      operationId: createTeam
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{teamId}:
    get:
      summary: Get team by ID
      operationId: getTeam
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      responses:
        "200":
          description: Team found
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    put:
      summary: Update team
      operationId: updateTeam
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Team updated
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      summary: Soft-delete a team
      operationId: deleteTeam
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIdParam"
      responses:
        "204":
          description: Team soft-deleted
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── SCM Connections ────────────────────────────────────────────────────────

  /scm-connections:
    get:
      summary: List SCM connections for the tenant
      operationId: listScmConnections
      tags: [scm-connections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Paginated list of SCM connections
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScmConnectionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      summary: Add a new SCM connection
      operationId: createScmConnection
      tags: [scm-connections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScmConnectionRequest"
      responses:
        "201":
          description: SCM connection created
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScmConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scm-connections/{connectionId}:
    get:
      summary: Get SCM connection by ID
      operationId: getScmConnection
      tags: [scm-connections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectionIdParam"
      responses:
        "200":
          description: SCM connection found
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScmConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    put:
      summary: Update SCM connection
      operationId: updateScmConnection
      tags: [scm-connections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectionIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScmConnectionRequest"
      responses:
        "200":
          description: SCM connection updated
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScmConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      summary: Remove SCM connection
      operationId: deleteScmConnection
      tags: [scm-connections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConnectionIdParam"
      responses:
        "204":
          description: SCM connection removed
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── CI ─────────────────────────────────────────────────────────────────────

  /ci/check:
    post:
      summary: Submit a contract check from CI pipeline
      description: |
        Used by GitHub Action and Azure DevOps task. Authenticated with `X-Cartogra-Api-Key`.
        **Not wrapped in the standard envelope** — responds with a flat `CiCheckResult` for easy
        CI script parsing. The `traceId` field is included at the top level of the result itself.
      operationId: ciCheck
      tags: [ci]
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiCheckRequest"
      responses:
        "200":
          description: Check result (compatible or warning)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Breaking changes detected
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiCheckResult"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Health ────────────────────────────────────────────────────────────────

  /actuator/health/liveness:
    get:
      summary: Liveness probe
      operationId: liveness
      tags: [health]
      responses:
        "200":
          description: Service alive

  /actuator/health/readiness:
    get:
      summary: Readiness probe
      operationId: readiness
      tags: [health]
      responses:
        "200":
          description: Service ready
        "503":
          description: Service not ready

# ── Components ─────────────────────────────────────────────────────────────

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cartogra_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Cartogra-Api-Key

  headers:
    XTraceId:
      description: OTel trace ID — 32 lowercase hex characters, no dashes
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  parameters:
    ServiceIdParam:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIdParam:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionIdParam:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    # ── Envelope ─────────────────────────────────────────────────────────────

    ApiResponse:
      description: Standard success envelope
      type: object
      required: [data, traceId]
      properties:
        data:
          description: Response payload
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          example: "a3f1c8d2e4b5f6a7b8c9d0e1f2a3b4c5"

    ApiError:
      description: Standard error envelope
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    # ── Service ───────────────────────────────────────────────────────────────

    ServiceDto:
      type: object
      required: [id, tenantId, name, healthStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        repositoryUrl:
          type: string
          nullable: true
        techStack:
          type: string
          nullable: true
          description: Serialized tech stack metadata
        metadata:
          type: string
          nullable: true
          description: Serialized service metadata
        healthStatus:
          type: string
          enum: [healthy, degraded, unhealthy, probe_auth_failed, unknown]
        lastDeployedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        externalId:
          type: string
          nullable: true
          description: Source-system stable key (e.g. org/repo for SCM, namespace/name for K8s)
        connectionId:
          type: string
          format: uuid
          nullable: true
          description: ID of the SCM or K8s connection that discovered this service
        source:
          type: string
          nullable: true
          description: Discovery source — "github", "azure_devops", or "kubernetes"
        repositoryRef:
          type: string
          nullable: true
          description: Default branch or ref of the SCM repository
        k8sCluster:
          type: string
          nullable: true
        k8sNamespace:
          type: string
          nullable: true
        k8sDeployment:
          type: string
          nullable: true
        healthEndpoint:
          type: string
          nullable: true
        lastCommitAt:
          type: string
          format: date-time
          nullable: true
        lastCommitSha:
          type: string
          nullable: true
        healthCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last health probe execution; null until first probe runs

    CreateServiceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        teamId:
          type: string
          format: uuid
        repositoryUrl:
          type: string
        techStack:
          type: string
        metadata:
          type: string
        healthEndpoint:
          type: string
          nullable: true
          description: Optional URL for health probing; validated for SSRF on save

    UpdateServiceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        repositoryUrl:
          type: string
          nullable: true
        techStack:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
        healthStatus:
          type: string
          enum: [healthy, degraded, unhealthy, probe_auth_failed, unknown]
          nullable: true
        healthEndpoint:
          type: string
          nullable: true
          description: Optional URL for health probing; validated for SSRF on save

    AssignOwnerRequest:
      type: object
      required: [teamId]
      properties:
        teamId:
          type: string
          format: uuid

    ServiceResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/ServiceDto"
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    ServicePageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServiceDto"
            total:
              type: integer
              format: int64
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    ServiceHistoryEntry:
      type: object
      required: [id, serviceId, tenantId, snapshot, changedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        snapshot:
          type: string
          description: JSON snapshot of the service state at the time of the change
        changedBy:
          type: string
          format: uuid
          nullable: true
        changedAt:
          type: string
          format: date-time

    ServiceHistoryPageResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServiceHistoryEntry"
            total:
              type: integer
              format: int64
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    # ── Team ──────────────────────────────────────────────────────────────────

    TeamDto:
      type: object
      required: [id, tenantId, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    UpdateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/TeamDto"
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    TeamListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TeamDto"
            total:
              type: integer
              format: int64
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    # ── SCM Connection ─────────────────────────────────────────────────────────

    ScmConnectionDto:
      type: object
      required: [id, tenantId, provider, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [github, azure_devops]
        config:
          type: string
          nullable: true
          description: Serialized provider configuration
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateScmConnectionRequest:
      type: object
      required: [provider, config]
      properties:
        provider:
          type: string
          enum: [github, azure_devops]
        config:
          type: string
          description: Serialized provider configuration (credentials, installation IDs, etc.)

    UpdateScmConnectionRequest:
      type: object
      required: [provider, config]
      properties:
        provider:
          type: string
          enum: [github, azure_devops]
        config:
          type: string

    ScmConnectionResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/ScmConnectionDto"
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    ScmConnectionListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ScmConnectionDto"
            total:
              type: integer
              format: int64
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    # ── CI ────────────────────────────────────────────────────────────────────

    CiCheckRequest:
      type: object
      required: [serviceId, specType, specContent]
      properties:
        serviceId:
          type: string
          format: uuid
        specType:
          type: string
          enum: [openapi, asyncapi]
        specContent:
          type: string
          description: Raw YAML or JSON spec content

    CiCheckResult:
      description: |
        Flat result — intentionally not wrapped in the standard envelope to simplify
        CI script parsing. The `traceId` field is included at the top level.
      type: object
      required: [result, checkId]
      properties:
        checkId:
          type: string
          format: uuid
        result:
          type: string
          enum: [compatible, warning, breaking]
        findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [breaking, warning, info]
              path:
                type: string
              description:
                type: string
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: Authenticated but not authorised
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: Resource already exists
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    TooManyRequests:
      description: Rate limit exceeded — enforced at the gateway
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
