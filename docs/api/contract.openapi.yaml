openapi: "3.1.0"
info:
  title: Cartogra Contract API
  version: "0.4.0"
  description: |
    Store each service's OpenAPI contract and its immutable versions (roadmap 5.1); list contracts, their
    version timeline and a structured diff of each version against the previous one (5.2); classify each
    version as breaking or compatible against the previous one, and filter the list by that verdict (5.3).
    The CI check (5.5) is not built yet.

    **Authentication:** JWT cookie or Bearer token (Gateway-issued). Gateway injects `X-Tenant-Id`.
    Writes need ADMIN or MEMBER; GUEST and VIEWER get 403.

    **Spec handling:** OpenAPI 3.0 and 3.1, as YAML or JSON, up to 1 MiB. A spec is canonicalized
    (object keys sorted recursively, arrays kept in order, compact JSON) and hashed with SHA-256, so the
    same document in YAML or JSON, with comments or reordered keys, has the same `specHash`. `$ref`s are
    not resolved.

    **Response envelope**:
    - Success: `{ "data": <T>, "traceId": "<32-hex>" }`
    - Error: `{ "error": { "code", "message", "details" }, "traceId": "<32-hex>" }`
    - Header: `X-Trace-Id: <same 32-hex traceId>`

servers:
  - url: http://localhost:8083/api/v1
    description: Local development (direct)
  - url: http://localhost:8080/api/v1
    description: Local development (via Gateway)

tags:
  - name: contracts
    description: API contracts and their versions

paths:
  /contracts:
    get:
      summary: List the tenant's contracts
      description: |
        Live contracts with their latest version, most recently changed first. `serviceName` comes from
        contract's projection of Registry services and is null until that projection has seen the service.
      operationId: listContracts
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of the service name
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: |
            Keep the contracts whose latest version is `breaking` or `compatible`. An unchecked latest version
            (stored before 5.3, `breaking: null`) matches neither. Another value returns 400 `VALIDATION_ERROR`.
          schema:
            type: string
            enum: [breaking, compatible]
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of contracts
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSummaryPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a service's contract with its first version
      description: |
        One live contract per service. A second create for the same service returns 409 `CONFLICT`
        with `details.contractId` set to the existing contract. A service Registry has deleted returns 404.
      operationId: createContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequest"
      responses:
        "201":
          description: Contract created with version 1
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidSpec"

  /contracts/{contractId}:
    get:
      summary: Read a contract with its latest version
      operationId: getContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      responses:
        "200":
          description: The contract and its latest version
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{contractId}/versions:
    get:
      summary: List a contract's versions, newest first
      operationId: listContractVersions
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of versions
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Publish a new version of a contract
      description: |
        Versions are numbered 1, 2, 3 per contract by the server; `label` is the spec's `info.version`,
        display only. A spec with the same `specHash` as the latest version stores nothing and returns
        that version with 200. A spec matching an older version (a revert) is stored as a new version.
        `serviceId` in the body is ignored.
      operationId: publishContractVersion
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequest"
      responses:
        "200":
          description: Spec unchanged; the latest version is returned and nothing is stored
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionEnvelope"
        "201":
          description: New version stored
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidSpec"

  /contracts/{contractId}/versions/{versionNumber}/diff:
    get:
      summary: Diff a version against the previous one
      description: |
        Both specs are compared in canonical form, so reformatting and key order never show as changes.
        `changes` is a structural diff of the two JSON trees (objects key by key, arrays by index), each change
        located by an RFC 6901 pointer. `lines` aligns the two specs rendered as YAML with sorted keys, row by row,
        for a side-by-side view. Version 1 is diffed against an empty spec: `from` is null and every line is added.
        `compatibility` is the breaking-change engine's verdict, computed on each request, so a version stored
        before 5.3 gets one too.
      operationId: diffContractVersion
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - name: versionNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The diff
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cartogra_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XTraceId:
      description: OTel trace ID — 32 lowercase hex characters, no dashes
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  parameters:
    ContractIdParam:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..100
      schema:
        type: integer
        default: 20
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0

  schemas:
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"

    ContractRequest:
      type: object
      required: [spec]
      properties:
        serviceId:
          type: string
          format: uuid
          description: Required on create; ignored when publishing a version
        spec:
          type: string
          minLength: 1
          maxLength: 1048576
          description: OpenAPI 3.0 or 3.1 document, YAML or JSON

    ContractVersion:
      type: object
      required: [id, contractId, versionNumber, specHash, breaking, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        label:
          type: [string, "null"]
          description: The spec's `info.version`
        specHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the canonical spec
        breaking:
          type: [boolean, "null"]
          description: |
            The breaking-change engine's verdict against the previous version, stored at publish. Version 1 is
            `false`. Null means unchecked: the version was stored before 5.3.
        createdAt:
          type: string
          format: date-time

    Contract:
      type: object
      required: [id, serviceId, serviceName, specType, createdAt, updatedAt, latestVersion]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: [string, "null"]
          description: Null until contract's projection of Registry services has seen the service
        specType:
          type: string
          enum: [openapi]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestVersion:
          $ref: "#/components/schemas/ContractVersion"

    ContractEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/Contract"
        traceId:
          $ref: "#/components/schemas/TraceId"

    ContractVersionEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/ContractVersion"
        traceId:
          $ref: "#/components/schemas/TraceId"

    ContractSummary:
      type: object
      required: [id, serviceId, serviceName, latestVersion, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: [string, "null"]
        latestVersion:
          $ref: "#/components/schemas/ContractVersion"
        updatedAt:
          type: string
          format: date-time

    ContractSummaryPageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ContractSummary"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

    ContractVersionPageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ContractVersion"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

    SpecChange:
      type: object
      required: [op, pointer, path]
      properties:
        op:
          type: string
          enum: [added, removed, changed]
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the canonical spec
        path:
          type: array
          items:
            type: string
          description: The pointer's unescaped segments, for display
        before:
          description: The value before; null when added
        after:
          description: The value after; null when removed

    DiffLine:
      type: object
      required: [kind, leftNo, left, rightNo, right]
      properties:
        kind:
          type: string
          enum: [same, added, removed, changed]
        leftNo:
          type: [integer, "null"]
        left:
          type: [string, "null"]
        rightNo:
          type: [integer, "null"]
        right:
          type: [string, "null"]

    CompatibilityChange:
      type: object
      required: [rule, breaking, direction, method, path, location, message]
      properties:
        rule:
          type: string
          enum:
            - path-removed
            - path-added
            - operation-removed
            - operation-added
            - response-field-removed
            - response-field-added
            - response-field-type-changed
            - response-enum-value-added
            - response-enum-value-removed
            - request-field-type-changed
            - request-field-required-added
            - request-field-optional-added
            - request-field-removed
            - request-field-required-removed
            - request-enum-value-removed
            - request-enum-value-added
            - parameter-type-changed
            - parameter-required-added
            - parameter-optional-added
            - parameter-required-removed
            - parameter-enum-value-removed
            - parameter-enum-value-added
        breaking:
          type: boolean
          description: Fixed per rule
        direction:
          type: string
          enum: [request, response, operation]
        method:
          type: [string, "null"]
          description: Upper-case HTTP method; null for a path rule
        path:
          type: string
          description: The path template, from the new spec (from the old one when removed)
        location:
          type: [string, "null"]
          description: |
            Null for a path or operation rule. Else a field path: `requestBody.items[].sku`, `responses.200.id`,
            or a parameter as `<in>.<name>` (for example `query.currency`)
        message:
          type: string

    Compatibility:
      type: object
      required: [isBreaking, changes]
      properties:
        isBreaking:
          type: boolean
          description: True when at least one change is breaking
        changes:
          type: array
          description: The rule hits; empty when no rule matched (for example, only description edits)
          items:
            $ref: "#/components/schemas/CompatibilityChange"

    VersionDiff:
      type: object
      required: [from, to, changes, lines, compatibility]
      properties:
        from:
          description: The previous version; null for version 1
          anyOf:
            - $ref: "#/components/schemas/ContractVersion"
            - type: "null"
        to:
          $ref: "#/components/schemas/ContractVersion"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SpecChange"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
        compatibility:
          $ref: "#/components/schemas/Compatibility"

    VersionDiffEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/VersionDiff"
        traceId:
          $ref: "#/components/schemas/TraceId"

    ApiError:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        traceId:
          $ref: "#/components/schemas/TraceId"

  responses:
    BadRequest:
      description: |
        `VALIDATION_ERROR` — blank spec, spec over 1 MiB, missing `serviceId` on create, malformed body, or an
        unknown `status` filter.
        `BAD_REQUEST` — malformed path id or missing header.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: "`FORBIDDEN` — caller's role cannot write (GUEST, VIEWER)"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: "`NOT_FOUND` — contract not in this tenant, or the service was deleted"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: "`CONFLICT` — the service already has a contract; `details.contractId` is its id"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InvalidSpec:
      description: |
        `INVALID_SPEC` — not YAML/JSON, not OpenAPI 3.x (Swagger 2.0, AsyncAPI), or fails OpenAPI validation.
        `details.messages` lists up to 50 parser messages.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
