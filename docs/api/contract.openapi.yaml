openapi: "3.1.0"
info:
  title: Cartogra Contract API
  version: "0.5.0"
  description: |
    Store each service's OpenAPI contract and its immutable versions (roadmap 5.1); list contracts, their
    version timeline and a structured diff of each version against the previous one (5.2); classify each
    version as breaking or compatible against the previous one, and filter the list by that verdict (5.3).
    CI sends a candidate spec to `POST /contracts/check` with a tenant API key (5.5).

    **Authentication:** JWT cookie or Bearer token (Gateway-issued). Gateway injects `X-Tenant-Id`.
    Writes need ADMIN or MEMBER; GUEST and VIEWER get 403.

    **Spec handling:** OpenAPI 3.0 and 3.1, as YAML or JSON, up to 1 MiB. A spec is canonicalized
    (object keys sorted recursively, arrays kept in order, compact JSON) and hashed with SHA-256, so the
    same document in YAML or JSON, with comments or reordered keys, has the same `specHash`. `$ref`s are
    not resolved.

    **Response envelope**:
    - Success: `{ "data": <T>, "traceId": "<32-hex>" }`
    - Error: `{ "error": { "code", "message", "details" }, "traceId": "<32-hex>" }`
    - Header: `X-Trace-Id: <same 32-hex traceId>`

servers:
  - url: http://localhost:8083/api/v1
    description: Local development (direct)
  - url: http://localhost:8080/api/v1
    description: Local development (via Gateway)

tags:
  - name: contracts
    description: API contracts and their versions
  - name: ci
    description: CI check of a candidate spec — API key only
  - name: notifications
    description: Notification rules for breaking checks, their attempts, and a test endpoint

paths:
  /contracts:
    get:
      summary: List the tenant's contracts
      description: |
        Live contracts with their latest version, most recently changed first. `serviceName` comes from
        contract's projection of Registry services and is null until that projection has seen the service.
      operationId: listContracts
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring of the service name
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: |
            Keep the contracts whose latest version is `breaking` or `compatible`. An unchecked latest version
            (stored before 5.3, `breaking: null`) matches neither. Another value returns 400 `VALIDATION_ERROR`.
          schema:
            type: string
            enum: [breaking, compatible]
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of contracts
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSummaryPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Create a service's contract with its first version
      description: |
        One live contract per service. A second create for the same service returns 409 `CONFLICT`
        with `details.contractId` set to the existing contract. A service Registry has deleted returns 404.
      operationId: createContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequest"
      responses:
        "201":
          description: Contract created with version 1
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidSpec"

  /contracts/{contractId}:
    get:
      summary: Read a contract with its latest version
      operationId: getContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      responses:
        "200":
          description: The contract and its latest version
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{contractId}/versions:
    get:
      summary: List a contract's versions, newest first
      operationId: listContractVersions
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of versions
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Publish a new version of a contract
      description: |
        Versions are numbered 1, 2, 3 per contract by the server; `label` is the spec's `info.version`,
        display only. A spec with the same `specHash` as the latest version stores nothing and returns
        that version with 200. A spec matching an older version (a revert) is stored as a new version.
        `serviceId` in the body is ignored.
      operationId: publishContractVersion
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractRequest"
      responses:
        "200":
          description: Spec unchanged; the latest version is returned and nothing is stored
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionEnvelope"
        "201":
          description: New version stored
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidSpec"

  /contracts/{contractId}/versions/{versionNumber}/diff:
    get:
      summary: Diff a version against the previous one
      description: |
        Both specs are compared in canonical form, so reformatting and key order never show as changes.
        `changes` is a structural diff of the two JSON trees (objects key by key, arrays by index), each change
        located by an RFC 6901 pointer. `lines` aligns the two specs rendered as YAML with sorted keys, row by row,
        for a side-by-side view. Version 1 is diffed against an empty spec: `from` is null and every line is added.
        `compatibility` is the breaking-change engine's verdict, computed on each request, so a version stored
        before 5.3 gets one too.
      operationId: diffContractVersion
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - name: versionNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The diff
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{contractId}/consumers:
    get:
      summary: List the services that consume a contract
      description: |
        A consumer is a service with a live declared or observed edge in the topology graph into the contract's
        service, over http or grpc. Its edges are merged into one row. Deleted services and self edges are left
        out. Sorted by service name; a service whose name is not known yet comes last with `serviceName` null.
      operationId: listContractConsumers
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1..100
          schema:
            type: integer
            default: 50
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of consumers
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/check:
    post:
      summary: Check a candidate spec against the baseline (CI)
      description: |
        Compares the candidate with the Baseline (the latest stored version) with the breaking-change engine.
        `service` is the service id (UUID) or its name (not case-sensitive), in the tenant of the key only.
        `affectedConsumers` lists all the consumers of the service when `isBreaking` is true, and is empty
        when it is false. A completed check writes one `contract_checks` row. It never creates a version,
        an audit event or a Kafka event. A failed check (400, 404, 409, 422) writes no row.

        **Authentication:** only `X-Cartogra-Api-Key` with the scope `ci:check`. The gateway gives 401 with
        no key or an unknown, revoked or expired key, and 403 with a JWT only or a key without the scope.
        Each key has its own rate-limit bucket.
      operationId: checkContract
      tags: [ci]
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCheckRequest"
      responses:
        "200":
          description: Check result
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractCheckEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`SERVICE_NOT_FOUND` (unknown, deleted or other-tenant service) or `BASELINE_NOT_FOUND` (no contract or no version)"
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "`SERVICE_AMBIGUOUS` — more than one live service has this name; send the id"
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/InvalidSpec"

  /contracts/notification-rules:
    get:
      summary: List the tenant's notification rules
      description: |
        Notification Rules in the tenant, most recently changed first. Webhooks and email addresses are
        masked in the backend response. Reads require an authenticated user.
      operationId: listNotificationRules
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of notification rules
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRulePageEnvelope"
    post:
      summary: Create a notification rule
      description: |
        One active rule is allowed per scope. A rule has no `serviceId` for the tenant-wide scope, or one
        `serviceId` for a Service scope. At least one destination is required. A webhook uses `https`, except
        that `http` is allowed on `localhost` and `127.0.0.1`. At most 20 email addresses are allowed.
        The response masks every destination; write a destination again to replace it.
      operationId: createNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleRequest"
      responses:
        "201":
          description: Rule created and enabled
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleEnvelope"
        "400":
          $ref: "#/components/responses/NotificationRuleBadRequest"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "409":
          $ref: "#/components/responses/NotificationRuleConflict"

  /contracts/notification-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleIdParam"
    get:
      summary: Read a notification rule
      operationId: getNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The rule with masked destinations
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleEnvelope"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"
    put:
      summary: Replace a notification rule
      description: Saved destinations are replaced by the request. A read never returns a raw destination.
      operationId: updateNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleRequest"
      responses:
        "200":
          description: The updated rule with masked destinations
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleEnvelope"
        "400":
          $ref: "#/components/responses/NotificationRuleBadRequest"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"
        "409":
          $ref: "#/components/responses/NotificationRuleConflict"
    patch:
      summary: Enable or disable a notification rule
      operationId: patchNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRulePatchRequest"
      responses:
        "200":
          description: The rule with its new enabled state
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleEnvelope"
        "400":
          $ref: "#/components/responses/NotificationRuleBadRequest"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"
    delete:
      summary: Soft-delete a notification rule
      operationId: deleteNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Rule deleted
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"

  /contracts/notification-rules/{ruleId}/enable:
    post:
      summary: Enable a notification rule
      operationId: enableNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleIdParam"
      responses:
        "200":
          description: The enabled rule
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleEnvelope"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"

  /contracts/notification-rules/{ruleId}/disable:
    post:
      summary: Disable a notification rule
      description: A disabled rule sends nothing on a check and refuses a test. Its settings stay saved.
      operationId: disableNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleIdParam"
      responses:
        "200":
          description: The disabled rule
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleEnvelope"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"

  /contracts/notification-rules/{ruleId}/test:
    post:
      summary: Test every destination of a saved rule
      description: |
        Sends one test message to each saved destination of this rule. A disabled rule returns 409
        `VALIDATION_ERROR` and sends nothing. The response lists the Delivery Attempt rows written by this test,
        one row per delivery try. A destination that needs a retry has one row for each try.
      operationId: testNotificationRule
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleIdParam"
      responses:
        "200":
          description: The attempt rows written by this test, one row per delivery try
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestEnvelope"
        "403":
          $ref: "#/components/responses/NotificationRuleForbidden"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"
        "409":
          $ref: "#/components/responses/NotificationRuleDisabled"

  /contracts/notification-rules/{ruleId}/attempts:
    get:
      summary: List the latest delivery attempts of a rule
      description: The newest 50 Delivery Attempts, newest first, in a shared page with offset zero.
      operationId: listNotificationAttempts
      tags: [notifications]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleIdParam"
      responses:
        "200":
          description: A page of the latest 50 attempts
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAttemptPageEnvelope"
        "404":
          $ref: "#/components/responses/NotificationRuleNotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cartogra_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Cartogra-Api-Key
      description: Tenant API key with the scope `ci:check`; accepted only on `POST /contracts/check`

  headers:
    XTraceId:
      description: OTel trace ID — 32 lowercase hex characters, no dashes
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  parameters:
    ContractIdParam:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RuleIdParam:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size, clamped to 1..100
      schema:
        type: integer
        default: 20
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0

  schemas:
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"

    ContractRequest:
      type: object
      required: [spec]
      properties:
        serviceId:
          type: string
          format: uuid
          description: Required on create; ignored when publishing a version
        spec:
          type: string
          minLength: 1
          maxLength: 1048576
          description: OpenAPI 3.0 or 3.1 document, YAML or JSON

    ContractVersion:
      type: object
      required: [id, contractId, versionNumber, specHash, breaking, createdAt, source]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        label:
          type: [string, "null"]
          description: The spec's `info.version`
        specHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the canonical spec
        breaking:
          type: [boolean, "null"]
          description: |
            The breaking-change engine's verdict against the previous version, stored at publish. Version 1 is
            `false`. Null means unchecked: the version was stored before 5.3.
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [manual, discovery]
          description: "`discovery` when spec discovery applied an OpenAPI file from an SCM repository"
        repositoryFullName:
          type: [string, "null"]
          description: The repository of a discovered version; null for a manual version
        filePath:
          type: [string, "null"]
          description: The path of the discovered file in the repository; null for a manual version

    Contract:
      type: object
      required: [id, serviceId, serviceName, specType, createdAt, updatedAt, latestVersion]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: [string, "null"]
          description: Null until contract's projection of Registry services has seen the service
        specType:
          type: string
          enum: [openapi]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestVersion:
          $ref: "#/components/schemas/ContractVersion"

    ContractEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/Contract"
        traceId:
          $ref: "#/components/schemas/TraceId"

    ContractVersionEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/ContractVersion"
        traceId:
          $ref: "#/components/schemas/TraceId"

    ContractSummary:
      type: object
      required: [id, serviceId, serviceName, latestVersion, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: [string, "null"]
        latestVersion:
          $ref: "#/components/schemas/ContractVersion"
        updatedAt:
          type: string
          format: date-time

    ContractSummaryPageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ContractSummary"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

    ContractVersionPageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ContractVersion"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

    Consumer:
      type: object
      required: [serviceId, serviceName, dependencyTypes, protocols]
      properties:
        serviceId:
          type: string
          format: uuid
        serviceName:
          type: [string, "null"]
        dependencyTypes:
          type: array
          items:
            type: string
            enum: [declared, observed]
        protocols:
          type: array
          items:
            type: string
            enum: [http, grpc]

    ConsumerPageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Consumer"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

    SpecChange:
      type: object
      required: [op, pointer, path]
      properties:
        op:
          type: string
          enum: [added, removed, changed]
        pointer:
          type: string
          description: RFC 6901 JSON pointer into the canonical spec
        path:
          type: array
          items:
            type: string
          description: The pointer's unescaped segments, for display
        before:
          description: The value before; null when added
        after:
          description: The value after; null when removed

    DiffLine:
      type: object
      required: [kind, leftNo, left, rightNo, right]
      properties:
        kind:
          type: string
          enum: [same, added, removed, changed]
        leftNo:
          type: [integer, "null"]
        left:
          type: [string, "null"]
        rightNo:
          type: [integer, "null"]
        right:
          type: [string, "null"]

    CompatibilityChange:
      type: object
      required: [rule, breaking, direction, method, path, location, message]
      properties:
        rule:
          type: string
          enum:
            - path-removed
            - path-added
            - operation-removed
            - operation-added
            - response-field-removed
            - response-field-added
            - response-field-type-changed
            - response-enum-value-added
            - response-enum-value-removed
            - request-field-type-changed
            - request-field-required-added
            - request-field-optional-added
            - request-field-removed
            - request-field-required-removed
            - request-enum-value-removed
            - request-enum-value-added
            - parameter-type-changed
            - parameter-required-added
            - parameter-optional-added
            - parameter-required-removed
            - parameter-enum-value-removed
            - parameter-enum-value-added
        breaking:
          type: boolean
          description: Fixed per rule
        direction:
          type: string
          enum: [request, response, operation]
        method:
          type: [string, "null"]
          description: Upper-case HTTP method; null for a path rule
        path:
          type: string
          description: The path template, from the new spec (from the old one when removed)
        location:
          type: [string, "null"]
          description: |
            Null for a path or operation rule. Else a field path: `requestBody.items[].sku`, `responses.200.id`,
            or a parameter as `<in>.<name>` (for example `query.currency`)
        message:
          type: string

    Compatibility:
      type: object
      required: [isBreaking, changes]
      properties:
        isBreaking:
          type: boolean
          description: True when at least one change is breaking
        changes:
          type: array
          description: The rule hits; empty when no rule matched (for example, only description edits)
          items:
            $ref: "#/components/schemas/CompatibilityChange"

    VersionDiff:
      type: object
      required: [from, to, changes, lines, compatibility]
      properties:
        from:
          description: The previous version; null for version 1
          anyOf:
            - $ref: "#/components/schemas/ContractVersion"
            - type: "null"
        to:
          $ref: "#/components/schemas/ContractVersion"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SpecChange"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
        compatibility:
          $ref: "#/components/schemas/Compatibility"

    ContractCheckRequest:
      type: object
      required: [service, spec]
      properties:
        service:
          type: string
          description: Service id (UUID) or service name (not case-sensitive)
          example: ledger-service
        spec:
          type: string
          description: Candidate OpenAPI 3.x spec, YAML or JSON

    ContractCheck:
      type: object
      required: [isBreaking, baselineVersion, changes, affectedConsumers]
      properties:
        isBreaking:
          type: boolean
        baselineVersion:
          type: integer
          description: Version number of the Baseline
        changes:
          type: array
          description: The rule hits of the engine; also lists compatible changes
          items:
            $ref: "#/components/schemas/CompatibilityChange"
        affectedConsumers:
          type: array
          description: All consumers (at most 500) when `isBreaking` is true; else empty
          items:
            $ref: "#/components/schemas/Consumer"

    ContractCheckEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/ContractCheck"
        traceId:
          $ref: "#/components/schemas/TraceId"

    VersionDiffEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/VersionDiff"
        traceId:
          $ref: "#/components/schemas/TraceId"

    ApiError:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        traceId:
          $ref: "#/components/schemas/TraceId"

    NotificationRuleRequest:
      type: object
      description: |
        Every field is optional. A rule needs at least one destination. A write replaces the saved value;
        a response returns a mask, never the raw destination.
      properties:
        serviceId:
          type: [string, "null"]
          format: uuid
          description: Null for the tenant-wide scope; a Service id for a Service scope
        slackWebhookUrl:
          type: [string, "null"]
          description: One Slack webhook; `https`, or `http` on localhost or 127.0.0.1
        teamsWebhookUrl:
          type: [string, "null"]
          description: One Teams webhook; `https`, or `http` on localhost or 127.0.0.1
        emailAddresses:
          type: [array, "null"]
          maxItems: 20
          description: At most 20 addresses of at most 255 characters each
          items:
            type: string
            format: email
            maxLength: 255
        enabled:
          type: [boolean, "null"]
          description: Ignored on create and update; required on patch. A new rule is enabled.

    NotificationRulePatchRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    NotificationRule:
      type: object
      required: [id, serviceId, enabled, slackWebhookUrl, teamsWebhookUrl, emailAddresses, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: [string, "null"]
          format: uuid
        enabled:
          type: boolean
        slackWebhookUrl:
          type: [string, "null"]
          description: Masked Slack webhook; host and path prefix with a mask, or null
        teamsWebhookUrl:
          type: [string, "null"]
          description: Masked Teams webhook; host and path prefix with a mask, or null
        emailAddresses:
          type: array
          description: Masked addresses; the first character and domain with a mask
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NotificationRuleEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: "#/components/schemas/NotificationRule"
        traceId:
          $ref: "#/components/schemas/TraceId"

    NotificationRulePageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotificationRule"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

    NotificationAttempt:
      type: object
      required: [id, ruleId, checkId, attempt, channel, destinationHint, waitMs, statusCode, errorCode, outcome, createdAt, finishedAt]
      properties:
        id:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        checkId:
          type: [string, "null"]
          format: uuid
          description: Null for a test message
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        channel:
          type: string
          enum: [slack, teams, email]
        destinationHint:
          type: [string, "null"]
          description: Masked destination; never a raw webhook or address
        waitMs:
          type: integer
          minimum: 0
        statusCode:
          type: [integer, "null"]
          description: HTTP status of the provider response
        errorCode:
          type: [string, "null"]
          description: Provider or network error code
        outcome:
          type: string
          enum: [pending, sent, failed]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: Null while the attempt is pending

    NotificationTestEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          description: The rows written by this test; one row per delivery try
          items:
            $ref: "#/components/schemas/NotificationAttempt"
        traceId:
          $ref: "#/components/schemas/TraceId"

    NotificationAttemptPageEnvelope:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotificationAttempt"
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
        traceId:
          $ref: "#/components/schemas/TraceId"

  responses:
    BadRequest:
      description: |
        `VALIDATION_ERROR` — blank spec, spec over 1 MiB, missing `serviceId` on create, malformed body, or an
        unknown `status` filter.
        `BAD_REQUEST` — malformed path id or missing header.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: "`FORBIDDEN` — caller's role cannot write (GUEST, VIEWER)"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: "`NOT_FOUND` — contract not in this tenant, or the service was deleted"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: "`CONFLICT` — the service already has a contract; `details.contractId` is its id"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InvalidSpec:
      description: |
        `INVALID_SPEC` — not YAML/JSON, not OpenAPI 3.x (Swagger 2.0, AsyncAPI), or fails OpenAPI validation.
        `details.messages` lists up to 50 parser messages.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotificationRuleBadRequest:
      description: |
        `VALIDATION_ERROR` — no destination, more than 20 addresses, an invalid address, or a webhook that
        does not use `https` on a remote host.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotificationRuleForbidden:
      description: "`FORBIDDEN` — a GUEST, VIEWER, or check API key cannot write a notification rule"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotificationRuleNotFound:
      description: "`NOT_FOUND` — the notification rule is not in this tenant, or was deleted"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotificationRuleConflict:
      description: "`CONFLICT` — an active rule already exists for this scope"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotificationRuleDisabled:
      description: "`VALIDATION_ERROR` — the rule is disabled and cannot be tested"
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
