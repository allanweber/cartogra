openapi: "3.1.0"
info:
  title: Cartogra Contract API
  version: "0.1.0"
  description: |
    API contract registry, breaking-change detection, consumer-producer matrix, and schema history.

    **Authentication:** JWT cookie or Bearer token (Gateway-issued). Gateway injects `X-Tenant-Id`.

    **CI endpoint** (`/ci/check`) accepts `X-Cartogra-Api-Key` and returns a flat (non-enveloped) result.

    **Response envelope**:
    - Success: `{ "data": <T>, "traceId": "<32-hex>" }`
    - Error: `{ "error": { "code", "message", "details" }, "traceId": "<32-hex>" }`
    - Header: `X-Trace-Id: <same 32-hex traceId>`

servers:
  - url: http://localhost:8083
    description: Local development (direct)
  - url: http://localhost:8080/api/contract
    description: Local development (via Gateway)

tags:
  - name: contracts
    description: API contract registration and management
  - name: versions
    description: Contract version history and schema diffs
  - name: consumers
    description: Consumer-producer relationship tracking
  - name: checks
    description: Compatibility check results
  - name: ci
    description: CI/CD integration — API key auth only
  - name: health
    description: Liveness and readiness probes

paths:
  # ── Contracts ─────────────────────────────────────────────────────────────

  /contracts:
    get:
      summary: List API contracts for the tenant
      operationId: listContracts
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: specType
          in: query
          schema:
            type: string
            enum: [openapi, asyncapi]
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Register a new API contract for a service
      operationId: createContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractRequest"
      responses:
        "201":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /contracts/{contractId}:
    get:
      summary: Get contract by ID
      operationId: getContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Soft-delete a contract
      operationId: deleteContract
      tags: [contracts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      responses:
        "204":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Versions ──────────────────────────────────────────────────────────────

  /contracts/{contractId}/versions:
    get:
      summary: List all published versions of a contract
      operationId: listContractVersions
      tags: [versions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      summary: Publish a new contract version
      operationId: publishContractVersion
      tags: [versions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishVersionRequest"
      responses:
        "201":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Version with same hash already exists
          $ref: "#/components/responses/Conflict"

  /contracts/{contractId}/versions/{versionId}/diff:
    get:
      summary: Compare two contract versions side-by-side
      operationId: diffContractVersions
      tags: [versions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - name: versionId
          in: path
          description: The newer (candidate) version ID
          required: true
          schema:
            type: string
            format: uuid
        - name: baselineVersionId
          in: query
          description: The older (baseline) version ID to diff against. Defaults to the previous published version.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDiffResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Consumers ─────────────────────────────────────────────────────────────

  /contracts/{contractId}/consumers:
    get:
      summary: List services consuming this contract
      operationId: listConsumers
      tags: [consumers]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      summary: Register a service as a consumer of this contract
      operationId: addConsumer
      tags: [consumers]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddConsumerRequest"
      responses:
        "201":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /contracts/{contractId}/consumers/{consumerId}:
    delete:
      summary: Remove a consumer relationship
      operationId: removeConsumer
      tags: [consumers]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContractIdParam"
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Compatibility matrix ──────────────────────────────────────────────────

  /matrix:
    get:
      summary: Consumer-producer compatibility matrix for the tenant
      description: Returns all consumer-producer pairs with their latest check status (green/yellow/red).
      operationId: getCompatibilityMatrix
      tags: [checks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilityMatrixResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /checks:
    get:
      summary: List compatibility check results
      operationId: listChecks
      tags: [checks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: contractId
          in: query
          schema:
            type: string
            format: uuid
        - name: result
          in: query
          schema:
            type: string
            enum: [compatible, warning, breaking]
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── CI ─────────────────────────────────────────────────────────────────────

  /ci/check:
    post:
      summary: Submit a contract spec for compatibility checking from CI
      description: |
        Used by GitHub Action and Azure DevOps Pipeline Task.
        Authenticated with `X-Cartogra-Api-Key`.
        Returns a **flat** (non-enveloped) result suitable for CI script parsing.
        Responds `422` when breaking changes are detected so CI steps can fail automatically.
      operationId: ciCheck
      tags: [ci]
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiCheckRequest"
      responses:
        "200":
          description: Compatible — no breaking changes
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Breaking changes detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiCheckResult"

  # ── Health ────────────────────────────────────────────────────────────────

  /actuator/health/liveness:
    get:
      summary: Liveness probe
      operationId: liveness
      tags: [health]
      responses:
        "200":
          description: Service alive

  /actuator/health/readiness:
    get:
      summary: Readiness probe
      operationId: readiness
      tags: [health]
      responses:
        "200":
          description: Service ready
        "503":
          description: Service not ready

# ── Components ─────────────────────────────────────────────────────────────

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cartogra_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Cartogra-Api-Key

  headers:
    XTraceId:
      description: OTel trace ID — 32 lowercase hex characters, no dashes
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"

  parameters:
    ContractIdParam:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    ApiResponse:
      type: object
      required: [data, traceId]
      properties:
        data: {}
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    ApiError:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

    Page:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ── Contract ──────────────────────────────────────────────────────────────

    ContractDto:
      type: object
      required: [id, tenantId, serviceId, specType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        specType:
          type: string
          enum: [openapi, asyncapi]
        latestVersionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateContractRequest:
      type: object
      required: [serviceId, specType]
      properties:
        serviceId:
          type: string
          format: uuid
        specType:
          type: string
          enum: [openapi, asyncapi]

    ContractResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ContractDto"

    ContractPageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: "#/components/schemas/ContractDto"
                page:
                  $ref: "#/components/schemas/Page"

    # ── Version ───────────────────────────────────────────────────────────────

    ContractVersionDto:
      type: object
      required: [id, contractId, version, specHash, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        version:
          type: string
        specHash:
          type: string
          description: SHA-256 of spec content
        createdAt:
          type: string
          format: date-time

    PublishVersionRequest:
      type: object
      required: [version, specContent]
      properties:
        version:
          type: string
          description: Semver or commit SHA
        specContent:
          type: string
          description: Raw YAML or JSON spec

    ContractVersionResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ContractVersionDto"

    ContractVersionPageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: "#/components/schemas/ContractVersionDto"
                page:
                  $ref: "#/components/schemas/Page"

    DiffFinding:
      type: object
      required: [severity, path, description]
      properties:
        severity:
          type: string
          enum: [breaking, warning, info]
        path:
          type: string
          example: "/paths/~1users~1{id}/get/responses/200/content"
        description:
          type: string

    VersionDiffResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              required: [baselineVersionId, candidateVersionId, result, findings]
              properties:
                baselineVersionId:
                  type: string
                  format: uuid
                candidateVersionId:
                  type: string
                  format: uuid
                result:
                  type: string
                  enum: [compatible, warning, breaking]
                findings:
                  type: array
                  items:
                    $ref: "#/components/schemas/DiffFinding"

    # ── Consumer ──────────────────────────────────────────────────────────────

    ConsumerDto:
      type: object
      required: [id, contractId, consumerServiceId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        consumerServiceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    AddConsumerRequest:
      type: object
      required: [consumerServiceId]
      properties:
        consumerServiceId:
          type: string
          format: uuid

    ConsumerResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConsumerDto"

    ConsumerListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ConsumerDto"

    # ── Checks ────────────────────────────────────────────────────────────────

    CheckDto:
      type: object
      required: [id, contractId, result, checkedAt]
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        baselineVersionId:
          type: string
          format: uuid
          nullable: true
        candidateVersionId:
          type: string
          format: uuid
          nullable: true
        result:
          type: string
          enum: [compatible, warning, breaking]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DiffFinding"
        checkedAt:
          type: string
          format: date-time

    CheckPageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              properties:
                content:
                  type: array
                  items:
                    $ref: "#/components/schemas/CheckDto"
                page:
                  $ref: "#/components/schemas/Page"

    MatrixCell:
      type: object
      required: [producerServiceId, consumerServiceId, contractId, result]
      properties:
        producerServiceId:
          type: string
          format: uuid
        consumerServiceId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        result:
          type: string
          enum: [compatible, warning, breaking, unchecked]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true

    CompatibilityMatrixResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/MatrixCell"

    # ── CI ────────────────────────────────────────────────────────────────────

    CiCheckRequest:
      type: object
      required: [serviceId, specType, specContent]
      properties:
        serviceId:
          type: string
          format: uuid
        specType:
          type: string
          enum: [openapi, asyncapi]
        specContent:
          type: string
          description: Raw YAML or JSON spec content
        baselineVersionId:
          type: string
          format: uuid
          description: Override the baseline version. Defaults to the latest published version.

    CiCheckResult:
      description: Flat result — not wrapped in envelope — for easy CI script parsing
      type: object
      required: [checkId, result]
      properties:
        checkId:
          type: string
          format: uuid
        result:
          type: string
          enum: [compatible, warning, breaking]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DiffFinding"
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: Resource already exists
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
