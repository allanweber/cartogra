apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: infra
  labels:
    app: otel-collector
    environment: production
    team: platform
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prom-scrape
      port: 8889
      targetPort: prom-scrape
