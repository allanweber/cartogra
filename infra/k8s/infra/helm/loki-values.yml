loki:
  image:
    repository: grafana/loki
    tag: "3.5.0"

  deploymentMode: SimpleScalable

  auth_enabled: false

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [service.name, service.namespace]
          - action: structured_metadata
            attributes: [traceId, spanId]

  schema_config:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

gateway:
  enabled: true

backend:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

read:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

write:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
