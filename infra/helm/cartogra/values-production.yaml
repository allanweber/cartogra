# Production on single-node k3s (ADR-0032): 1 replica, no PDB/HPA, sized for an 8GB ARM VM.
# Probes, requests+limits, securityContext, secrets-as-volumes and labels still apply.

global:
  environment: production
  host: cartogra.dev

# Fixed Acme tenant UUID, created by the step-6 bootstrap Job. Referenced below for guest
# mode (gateway) and span stamping (collector); keep the three in sync.
x-acmeTenantId: &acmeTenantId "a0000000-0000-4000-8000-00000000ac3e"

x-jvm: &jvm
  replicaCount: 1
  pdb: { enabled: false }
  autoscaling: { enabled: false }
  javaOpts: "-XX:+UseSerialGC -Xss512k"
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 500m, memory: 512Mi }
  probes:
    # SerialGC + 0.5 CPU starts slowly: allow up to 5 minutes.
    startupFailureThreshold: 60

gateway:
  <<: *jvm
  env:
    GUEST_TENANT_ID: *acmeTenantId
    SIGNUP_ENABLED: "false"
    # Acme Fintech, the simulated customer (infra/helm/acme). Signup is off, so the gateway creates it.
    BOOTSTRAP_TENANT_ID: *acmeTenantId
    BOOTSTRAP_TENANT_NAME: Acme Fintech
    BOOTSTRAP_TENANT_PLAN: business
    BOOTSTRAP_ADMIN_EMAIL: admin@acme-fintech.invalid
    BOOTSTRAP_TENANT_PUBLIC_SANDBOX: "true"

registry:
  <<: *jvm

topology:
  <<: *jvm
  # Heap (75%) + non-heap outgrew 512Mi; 640Mi lifts the heap cap to ~480m.
  resources:
    requests: { cpu: 250m, memory: 640Mi }
    limits: { cpu: 500m, memory: 640Mi }
  env:
    # Default P7D would hide seeded "missing" drift for a week. Safe only with continuous
    # in-cluster Acme traffic (step 6); bursty traffic + a short window makes drift flap.
    TOPOLOGY_DRIFT_MISSING_AFTER: PT1H

ingestion:
  <<: *jvm

# Node memory requests ~88% with contract added: resize the VM before Phase 6.
contract:
  <<: *jvm

frontend:
  replicaCount: 1
  pdb: { enabled: false }
  autoscaling: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 100m, memory: 192Mi }

collector:
  replicaCount: 1
  pdb: { enabled: false }
  env:
    CARTOGRA_TENANT_ID: *acmeTenantId
  # Uses ~65Mi (2026-11-18).
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 100m, memory: 128Mi }

postgres:
  config:
    max_connections: "100"
    shared_buffers: 128MB
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 200m, memory: 384Mi }

# Uses ~4Mi; maxmemory stays below the limit.
valkey:
  maxmemory: 32mb
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 64Mi }

kafka:
  heapOpts: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=50"  # ≈384m of 768Mi; extra room is off-heap
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: 500m, memory: 768Mi }

alerting:
  enabled: true
  # Prometheus uses ~50Mi, Alertmanager ~11Mi (2026-11-18).
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 100m, memory: 128Mi }
  alertmanager:
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 40m, memory: 32Mi }
  email:
    from: alerts@cartogra.dev
    # to: set at deploy time (GitHub environment variable ALERT_EMAIL).

backup:
  enabled: true
  s3:
    endpoint: https://fsn1.your-objectstorage.com
    region: fsn1
    bucket: cartogra-production-backups
  offsite:
    enabled: true
    bucket: cartogra-production-backups
  verify:
    enabled: true
