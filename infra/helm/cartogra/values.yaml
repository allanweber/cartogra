# Production-shaped defaults (HA per .claude/rules/infra.md). The production host overrides these
# with values-production.yaml (single node, ADR-0032).

global:
  environment: prod
  team: platform
  # Public hostname; ingress, OAuth redirects and CORS derive from it.
  host: ""
  # Our images: <imageRegistry>/cartogra-<service>:<imageTag>. CI sets imageTag to the commit SHA.
  imageRegistry: ghcr.io/allanweber
  imageTag: ""

ingress:
  enabled: true
  className: traefik
  # cert-manager ClusterIssuer; empty disables TLS.
  clusterIssuer: letsencrypt-prod
  annotations: {}

# Prometheus + Alertmanager on the guest counters, emailed through SMTP (charts/alerting).
alerting:
  enabled: false

# Hourly pg_dump to S3-compatible object storage (Hetzner Object Storage in production).
# Secret `backup.secretName` keys: S3_ACCESS_KEY, S3_SECRET_KEY. Writes <prefix>/daily/ each run and <prefix>/monthly/ on the 1st;
# retention = bucket lifecycle rules (30d daily, 365d monthly) + object lock (plans/025).
backup:
  enabled: false
  # Hourly: at most 1 hour of data loss. The 00:xx run on the 1st also writes monthly/.
  schedule: "17 * * * *"
  secretName: backup-secrets
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    prefix: postgres
  postgres:
    host: postgres
    database: cartogra
    secretName: postgres-secrets
    image: docker.io/library/postgres:16-alpine
  uploader:
    image: docker.io/amazon/aws-cli:2.31.35
  # Second copy of each dump at another provider (Cloudflare R2). Secret keys: R2_ACCESS_KEY, R2_SECRET_KEY, R2_ENDPOINT.
  offsite:
    enabled: false
    secretName: backup-offsite-secrets
    bucket: ""
  # healthchecks.io pings after a successful backup (BACKUP_URL) and restore verify (VERIFY_URL). Optional secret.
  heartbeat:
    secretName: backup-heartbeat
    image: docker.io/curlimages/curl:8.22.0
  # Weekly restore of the newest daily dump into a throwaway Postgres (templates/backup-verify-cronjob.yaml).
  verify:
    enabled: false
    schedule: "0 4 * * 0"
    requiredTables:
      - registry.flyway_schema_history_registry
      - registry.tenants
      - registry.services
      - topology.flyway_schema_history_topology
      - topology.dependencies
      - ingestion.flyway_schema_history_ingestion
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 128Mi
