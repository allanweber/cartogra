{{- if .Values.backup.enabled }}
{{- $b := .Values.backup }}
{{- $labels := dict "app" "postgres-backup" "version" (.Values.global.imageTag | default .Chart.AppVersion) "environment" .Values.global.environment "team" .Values.global.team }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  schedule: {{ $b.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- toYaml $labels | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: {{ $b.postgres.image }}
              command: ["sh", "-c"]
              args:
                - >-
                  PGPASSWORD="$(cat /secrets/postgres/DB_PASSWORD)"
                  pg_dump -h {{ $b.postgres.host }} -U "$(cat /secrets/postgres/DB_USERNAME)"
                  -d {{ $b.postgres.database }} -Fc -f /backup/cartogra.dump
              resources:
                {{- toYaml $b.resources | nindent 16 }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: postgres-secrets, mountPath: /secrets/postgres, readOnly: true }
                - { name: tmp, mountPath: /tmp }
            # Hetzner first, then the R2 copy (backup.offsite). A failure stops the job, so the heartbeat is not sent.
            - name: upload
              image: {{ $b.uploader.image }}
              command: ["sh", "-c"]
              args:
                - >-
                  FILE="cartogra-$(date -u +%Y-%m-%dT%H%MZ).dump" &&
                  MONTHLY="$([ "$(date -u +%d%H)" = "0100" ] && echo yes || true)" &&
                  put() { aws s3 cp /backup/cartogra.dump "$1/daily/$FILE" $2 &&
                  if [ -n "$MONTHLY" ]; then aws s3 cp /backup/cartogra.dump "$1/monthly/$FILE" $2; fi; } &&
                  export AWS_ACCESS_KEY_ID="$(cat /secrets/s3/S3_ACCESS_KEY)" AWS_SECRET_ACCESS_KEY="$(cat /secrets/s3/S3_SECRET_KEY)" &&
                  put "s3://{{ required "backup.s3.bucket is required" $b.s3.bucket }}/{{ $b.s3.prefix }}"
                  "--endpoint-url {{ required "backup.s3.endpoint is required" $b.s3.endpoint }} --region {{ required "backup.s3.region is required" $b.s3.region }} --checksum-algorithm CRC32"
                  {{- if $b.offsite.enabled }} &&
                  export AWS_ACCESS_KEY_ID="$(cat /secrets/offsite/R2_ACCESS_KEY)" AWS_SECRET_ACCESS_KEY="$(cat /secrets/offsite/R2_SECRET_KEY)" &&
                  put "s3://{{ required "backup.offsite.bucket is required" $b.offsite.bucket }}/{{ $b.s3.prefix }}"
                  "--endpoint-url $(cat /secrets/offsite/R2_ENDPOINT) --region auto --checksum-algorithm CRC32"
                  {{- end }}
              env:
                - name: HOME
                  value: /tmp
              resources:
                {{- toYaml $b.resources | nindent 16 }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: s3-secrets, mountPath: /secrets/s3, readOnly: true }
                {{- if $b.offsite.enabled }}
                - { name: offsite-secrets, mountPath: /secrets/offsite, readOnly: true }
                {{- end }}
                - { name: tmp, mountPath: /tmp }
          containers:
            # Runs only after both uploads succeeded. A late ping makes healthchecks.io send an email.
            - name: heartbeat
              image: {{ $b.heartbeat.image }}
              command: ["sh", "-c"]
              args:
                - >-
                  if [ -f /secrets/heartbeat/BACKUP_URL ]; then
                  curl -fsS -m 10 --retry 3 -o /dev/null "$(cat /secrets/heartbeat/BACKUP_URL)" && echo "heartbeat sent";
                  else echo "no heartbeat secret: {{ $b.heartbeat.secretName }}"; fi
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 50m, memory: 16Mi }
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: heartbeat-secrets, mountPath: /secrets/heartbeat, readOnly: true }
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: postgres-secrets
              secret:
                secretName: {{ $b.postgres.secretName }}
            - name: s3-secrets
              secret:
                secretName: {{ $b.secretName }}
            {{- if $b.offsite.enabled }}
            - name: offsite-secrets
              secret:
                secretName: {{ $b.offsite.secretName }}
            {{- end }}
            - name: heartbeat-secrets
              secret:
                secretName: {{ $b.heartbeat.secretName }}
                optional: true
{{- end }}
