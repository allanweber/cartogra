# frontend — TanStack Start web app (SSR).

# Plain (non-secret) env, rendered into a ConfigMap; values go through `tpl`.
env:
  GATEWAY_INTERNAL_URL: http://gateway:8080
  NODE_ENV: production

image:
  # Empty = global.imageRegistry.
  registry: ""
  repository: cartogra-frontend
  # Defaults to global.imageTag, then the chart appVersion. Never `latest`.
  tag: ""

port: 3000

probes:
  basePath: ""
  livePath: /
  readyPath: /
  startupPath: /
  startupFailureThreshold: 36

replicaCount: 3

pdb:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Memory limit = request (Guaranteed memory); CPU limit ≈ 2× request.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "200m"
    memory: 256Mi

javaOpts: ""

podSecurityContext: {}

# Files from this Secret are mounted read-only; create it from a SealedSecret (never commit a plain Secret).
secret:
  enabled: false
  name: ""
  mountPath: /etc/cartogra/secrets
  springConfigTree: false

extraVolumes: []
extraVolumeMounts: []
extraServicePorts: []
