# topology — Dependency graph, observed edges, drift.
# Secret keys (files under secret.mountPath): DB_USERNAME, DB_PASSWORD

# Plain (non-secret) env, rendered into a ConfigMap; values go through `tpl`.
env:
  DB_URL: jdbc:postgresql://postgres:5432/cartogra?currentSchema=topology
  SPRING_FLYWAY_TABLE: flyway_schema_history_topology
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REGISTRY_URI: http://registry:8081
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,info
  TOPOLOGY_DRIFT_MISSING_AFTER: P7D

image:
  # Empty = global.imageRegistry.
  registry: ""
  repository: cartogra-topology
  # Defaults to global.imageTag, then the chart appVersion. Never `latest`.
  tag: ""

port: 8082

probes:
  basePath: "/api/v1/topology"
  livePath: /actuator/health/live
  readyPath: /actuator/health/ready
  startupPath: /actuator/health
  startupFailureThreshold: 36

# Backends trust X-Tenant-Id / X-User-* headers, so only callers listed here may reach the app port: only the gateway proxies to it.
# Needs a CNI that enforces NetworkPolicy (k3s does); others ignore it silently.
networkPolicy:
  allowFrom:
    - gateway

replicaCount: 3

pdb:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Memory limit = request (Guaranteed memory); CPU limit ≈ 2× request.
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 768Mi

javaOpts: ""

podSecurityContext: {}

# Files from this Secret are mounted read-only; create it from a SealedSecret (never commit a plain Secret).
secret:
  enabled: true
  name: ""
  mountPath: /etc/cartogra/secrets
  springConfigTree: true

extraVolumes: []
extraVolumeMounts: []
extraServicePorts: []
