# kafka — single KRaft node; replication factors 1. Clients use kafka:9092.

image:
  registry: docker.io
  repository: apache/kafka
  tag: "4.0.0"

# Fixed so a restart with the same PVC keeps its log dirs valid.
clusterId: MkU3OEVBNTcwNTJENDM2Qk

# Percent of the container limit (infra.md: never hard-set -Xmx); 50% of 1Gi = the old 512m.
heapOpts: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=50"

persistence:
  size: 10Gi
  storageClass: ""

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi

# The apache/kafka image runs as appuser (uid 1000).
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
