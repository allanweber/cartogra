{{- $name := include "common.name" . -}}
{{- if .Values.nodeMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrape.interval }}
      evaluation_interval: 30s
    rule_files:
      - /etc/alerting/rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [localhost:9093]
    scrape_configs:
      - job_name: collector
        static_configs:
          - targets: [{{ .Values.scrape.target | quote }}]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: cartogra_.*
            action: keep
    {{- if .Values.nodeMetrics.enabled }}
      # Container memory/CPU/OOM from the kubelet for the capacity rules. Needs ClusterRole cartogra-node-metrics
      # (infra/k8s/cluster-setup.yaml); NodeMetricsMissing fires without it.
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics/cadvisor
        scrape_interval: {{ .Values.nodeMetrics.interval }}
        kubernetes_sd_configs:
          - role: node
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: {{ .Values.nodeMetrics.insecureSkipVerify }}
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_memory_working_set_bytes|container_spec_memory_limit_bytes|container_cpu_usage_seconds_total|container_start_time_seconds|machine_memory_bytes|machine_cpu_cores
            action: keep
          # Per-container series plus the node root cgroup (id="/"); pod-level cgroups dropped.
          - source_labels: [container, id]
            regex: ;/.+
            action: drop
    {{- end }}
  rules.yml: |
    {{- .Files.Get "files/rules.yml" | nindent 4 }}
  alertmanager.yml: |
    global:
      smtp_smarthost: {{ .Values.email.smarthost | quote }}
      smtp_from: {{ required "alerting.email.from is required" .Values.email.from | quote }}
      smtp_auth_username: {{ .Values.email.username | quote }}
      smtp_auth_password_file: /etc/alerting/smtp/{{ .Values.email.passwordKey }}
      smtp_require_tls: true
    route:
      receiver: email
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: email
        email_configs:
          - to: {{ required "alerting.email.to is required" .Values.email.to | quote }}
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ (print (toJson .Values) (.Files.Get "files/rules.yml")) | sha256sum | trunc 16 }}
    spec:
      {{- if .Values.nodeMetrics.enabled }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- include "common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ include "common.image" . }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alerting/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time={{ .Values.retention }}
          ports:
            - name: prometheus
              containerPort: 9090
          resources:
            {{- include "common.resources" . | nindent 12 }}
          securityContext:
            {{- include "common.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /-/healthy, port: prometheus }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /-/ready, port: prometheus }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /-/ready, port: prometheus }
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - { name: config, mountPath: /etc/alerting, readOnly: true }
            - { name: prometheus-data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alerting/alertmanager.yml
            - --storage.path=/data
            - --cluster.listen-address=
          ports:
            - name: alertmanager
              containerPort: 9093
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          securityContext:
            {{- include "common.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /-/healthy, port: alertmanager }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /-/ready, port: alertmanager }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /-/ready, port: alertmanager }
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - { name: config, mountPath: /etc/alerting, readOnly: true }
            - { name: smtp, mountPath: /etc/alerting/smtp, readOnly: true }
            - { name: alertmanager-data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: smtp
          secret:
            secretName: {{ .Values.email.passwordSecret }}
            items:
              - key: {{ .Values.email.passwordKey }}
                path: {{ .Values.email.passwordKey }}
        - name: prometheus-data
          emptyDir: { sizeLimit: 512Mi }
        - name: alertmanager-data
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: {}
