apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.reader.name }}
automountServiceAccountToken: false
---
# Long-lived token for Cartogra's ingestion (stored encrypted there). Rotate by deleting this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.reader.name }}-token
  annotations:
    kubernetes.io/service-account.name: {{ .Values.reader.name }}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Values.reader.name }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ .Values.reader.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Values.reader.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.reader.name }}
    namespace: {{ .Release.Namespace }}
