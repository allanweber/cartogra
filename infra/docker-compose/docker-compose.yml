services:

  postgres:
    image: postgres:16-alpine
    container_name: cartogra-postgres
    environment:
      POSTGRES_DB: cartogra
      POSTGRES_USER: cartogra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartogra}
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartogra -d cartogra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cartogra-net

  valkey:
    image: valkey/valkey:8-alpine
    container_name: cartogra-valkey
    ports:
      - "6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cartogra-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: cartogra-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cartogra-net

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/gateway/Dockerfile
    image: cartogra/gateway:local
    container_name: cartogra-gateway
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cartogra?currentSchema=registry
      DB_USERNAME: cartogra
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cartogra}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REGISTRY_URI: http://registry:8081
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-bytes}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_placeholder}
      RESEND_FROM: ${RESEND_FROM:-noreply@cartogra.dev}
      RESEND_TEST_MODE: ${RESEND_TEST_MODE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,info
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cartogra-net

  registry:
    build:
      context: ../..
      dockerfile: infra/docker/registry/Dockerfile
    image: cartogra/registry:local
    container_name: cartogra-registry
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cartogra
      SPRING_DATASOURCE_USERNAME: cartogra
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cartogra}
      SPRING_FLYWAY_TABLE: flyway_schema_history_registry
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,info
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cartogra-net

  ingestion:
    build:
      context: ../..
      dockerfile: infra/docker/ingestion/Dockerfile
    image: cartogra/ingestion:local
    container_name: cartogra-ingestion
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cartogra
      SPRING_DATASOURCE_USERNAME: cartogra
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cartogra}
      SPRING_FLYWAY_TABLE: flyway_schema_history_ingestion
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,info
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cartogra-net

volumes:
  postgres-data:
  valkey-data:
  kafka-data:

networks:
  cartogra-net:
    driver: bridge
