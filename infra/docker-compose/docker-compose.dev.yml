name: cartogra-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: cartogra-postgres
    environment:
      POSTGRES_DB: cartogra
      POSTGRES_USER: cartogra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartogra}
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartogra -d cartogra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cartogra-net

  valkey:
    image: valkey/valkey:8-alpine
    container_name: cartogra-valkey
    ports:
      - "6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cartogra-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: cartogra-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cartogra-net

  tempo:
    image: grafana/tempo:2.7.1
    container_name: cartogra-tempo
    command: ["-config.file=/etc/tempo-config.yml"]
    restart: on-failure
    volumes:
      - ./tempo-config.yml:/etc/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cartogra-net

  loki:
    image: grafana/loki:3.5.0
    container_name: cartogra-loki
    command: ["-config.file=/etc/loki-config.yml"]
    restart: on-failure
    volumes:
      - ./loki-config.yml:/etc/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cartogra-net

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: cartogra-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"
    restart: on-failure
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cartogra-net

  grafana:
    image: grafana/grafana:12.0.0
    container_name: cartogra-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cartogra/cartogra-observability.json
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor metricsSummary
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards/cartogra:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3001"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cartogra-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    container_name: cartogra-otel-collector
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cartogra-net

  kafka-ui:
    image: redpandadata/console:v2.7.2
    container_name: cartogra-kafka-ui
    command: ["-config.filepath=/app/console-config.yml"]
    volumes:
      - ./console-config.yml:/app/console-config.yml:ro
    ports:
      - "8086:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cartogra-net

  valkey-ui:
    image: ghcr.io/joeferner/redis-commander:0.9.1
    container_name: cartogra-valkey-ui
    environment:
      REDIS_HOSTS: local:valkey:6379
    ports:
      - "8087:8081"
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - cartogra-net

volumes:
  postgres-data:
  valkey-data:
  kafka-data:
  pgadmin-data:
  tempo-data:
    driver: local
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  cartogra-net:
    driver: bridge
