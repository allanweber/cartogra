extensions:
  health_check: {}

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - { action: upsert, key: service.namespace, value: cartogra }
  # Dev-only tenant stamp for the observed-edges feed (ADR-0029). `insert` keeps a tenant already
  # on the span; compose defaults CARTOGRA_TENANT_ID to "unset" (empty fails collector validation), which filter/no-self drops.
  resource/tenant:
    attributes:
      - { action: insert, key: cartogra.tenant.id, value: "${env:CARTOGRA_TENANT_ID}" }

  # Cartogra's own spans must not feed the span worker: they carry no tenant, and Topology's own
  # (Kafka consumer, JDBC, DLQ publishes) would make consuming a record generate the next one.
  # Spans still on the "unset" tenant would only be quarantined, so they are dropped here too.
  # Revisit with 7.9 when Cartogra's own CLIENT spans are meant to become edges.
  filter/no-self:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == "topology"'
        - 'resource.attributes["service.name"] == "gateway"'
        - 'resource.attributes["service.name"] == "registry"'
        - 'resource.attributes["service.name"] == "ingestion"'
        - 'resource.attributes["cartogra.tenant.id"] == "unset"'

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: cartogra
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  kafka/spans:
    brokers: [kafka:29092]
    traces:
      topic: cartogra.observability.spans
      encoding: otlp_json

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    traces/spans:
      receivers: [otlp]
      processors: [memory_limiter, resource, resource/tenant, filter/no-self, batch]
      exporters: [kafka/spans]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
